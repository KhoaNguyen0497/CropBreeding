name: Build and release Crop Breeding
on:
  push:
    branches: [main]
    paths: [src/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download pinned build-only references
        uses: actions/checkout@v4
        with:
          repository: StardewModders/mod-reference-assemblies
          ref: 0141355fecb8536715ecff22f99374b5e632cbed
          path: .references
      - name: Test trait rules
        run: dotnet run --project tests/TraitRules.Tests.csproj --configuration Release
      - name: Test safety and integrations
        run: dotnet run --project safety-tests/Safety.Tests.csproj --configuration Release
      - name: Compile mod
        run: dotnet build src/CropBreeding.csproj --configuration Release -p:GamePath="$GITHUB_WORKSPACE/.references"
      - name: Package installable ZIP
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: CropBreeding-installable
          path: artifacts/*.zip
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("src/manifest.json"))["Version"])')
          tag="v$version"
          python - "$version" > "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib, sys
          text = pathlib.Path("CHANGELOG.md").read_text()
          heading = "## " + sys.argv[1] + "\n"
          if heading not in text:
              raise SystemExit("Missing version-specific release notes")
          print(text.split(heading, 1)[1].split("\n## ", 1)[0].strip())
          PY
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists; bump Version to publish new files."
          else
            gh release create "$tag" "artifacts/CropBreeding-$version.zip" --target "$GITHUB_SHA" --title "Crop Breeding $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
